<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Phone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0a0a0f;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  user-select:none;
}

/* ====== PHONE SHELL ====== */
.phone-shell{
  width:360px;
  height:760px;
  background:#1c1c1e;
  border-radius:52px;
  border:1.5px solid #3a3a3c;
  position:relative;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 0 1px #000, 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08);
}

.power-btn{
  position:absolute;right:-3px;top:140px;
  width:4px;height:60px;background:#2c2c2e;
  border-radius:0 3px 3px 0;
  border:1px solid #3a3a3c;cursor:pointer;
  border-left:none;
  transition:background 0.1s;
  z-index:100;
}
.power-btn:active{background:#1a1a1c;}

.vol-up{
  position:absolute;left:-3px;top:120px;
  width:4px;height:36px;background:#2c2c2e;
  border-radius:3px 0 0 3px;
  border:1px solid #3a3a3c;border-right:none;
}
.vol-down{
  position:absolute;left:-3px;top:168px;
  width:4px;height:60px;background:#2c2c2e;
  border-radius:3px 0 0 3px;
  border:1px solid #3a3a3c;border-right:none;
}

.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:100px;height:28px;
  background:#1c1c1e;
  border-radius:0 0 18px 18px;
  z-index:50;
  border:1px solid #3a3a3c;border-top:none;
}

/* ====== LOCK SCREEN ====== */
#lockScreen{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0a0a14 0%,#12082a 50%,#1a0a1a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:40;
  border-radius:52px;
  transition:opacity 0.5s,transform 0.5s;
}
#lockScreen.unlock{
  opacity:0;transform:scale(1.04);pointer-events:none;
}
.lock-time{font-size:68px;font-weight:200;color:#fff;letter-spacing:-2px;line-height:1;}
.lock-date{font-size:14px;color:rgba(255,255,255,0.55);margin-top:6px;letter-spacing:0.3px;}
.lock-notification{
  margin-top:40px;
  background:rgba(255,255,255,0.1);
  border:0.5px solid rgba(255,255,255,0.15);
  border-radius:16px;
  padding:12px 16px;
  width:280px;
  backdrop-filter:blur(10px);
  animation:notifPop 0.4s 1s both ease;
}
@keyframes notifPop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.notif-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.notif-icon{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#db2777);display:flex;align-items:center;justify-content:center;font-size:11px;}
.notif-app{font-size:11px;color:rgba(255,255,255,0.5);font-weight:500;letter-spacing:0.3px;text-transform:uppercase;}
.notif-time{font-size:11px;color:rgba(255,255,255,0.35);margin-left:auto;}
.notif-sender{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px;}
.notif-preview{font-size:13px;color:rgba(255,255,255,0.6);}
.swipe-hint{
  position:absolute;bottom:36px;
  font-size:12px;color:rgba(255,255,255,0.3);
  letter-spacing:0.5px;
  animation:breathe 2s infinite;
}
@keyframes breathe{0%,100%{opacity:0.3;}50%{opacity:0.7;}}
.swipe-line{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  width:100px;height:4px;background:rgba(255,255,255,0.25);border-radius:2px;
}

/* ====== HOME SCREEN ====== */
#homeScreen{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0a0a14 0%,#12082a 50%,#1a0a1a 100%);
  display:flex;flex-direction:column;
  z-index:30;
  border-radius:52px;
  opacity:0;pointer-events:none;
  transition:opacity 0.4s;
}
#homeScreen.active{opacity:1;pointer-events:all;}
.home-status{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px 0;font-size:12px;color:rgba(255,255,255,0.7);font-weight:500;
}
.home-time-big{
  text-align:center;margin-top:28px;
  font-size:52px;font-weight:200;color:#fff;letter-spacing:-1px;
}
.home-date-small{text-align:center;font-size:13px;color:rgba(255,255,255,0.45);margin-top:2px;}

.app-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:16px;padding:30px 20px 0;
  flex:1;align-content:start;
}
.app-icon{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;
}
.app-icon-img{
  width:56px;height:56px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  transition:transform 0.15s;
  position:relative;
}
.app-icon-img:active{transform:scale(0.9);}
.app-icon-label{font-size:11px;color:rgba(255,255,255,0.7);text-align:center;}
.app-badge{
  position:absolute;top:-4px;right:-4px;
  background:#ff3b30;border-radius:50%;
  width:18px;height:18px;font-size:11px;font-weight:600;
  color:#fff;display:flex;align-items:center;justify-content:center;
  border:2px solid #0a0a14;
}
.app-dock{
  background:rgba(255,255,255,0.08);
  border-top:0.5px solid rgba(255,255,255,0.1);
  border-radius:0 0 52px 52px;
  display:flex;justify-content:space-around;align-items:center;
  padding:14px 20px 28px;
  margin-top:auto;
}
.home-indicator{
  width:100px;height:4px;background:rgba(255,255,255,0.25);
  border-radius:2px;margin:8px auto 6px;
}

/* ====== CHAT APP ====== */
#chatApp{
  position:absolute;inset:0;
  background:#111118;
  display:flex;flex-direction:column;
  z-index:20;
  border-radius:52px;
  opacity:0;pointer-events:none;
  transition:opacity 0.35s;
}
#chatApp.active{opacity:1;pointer-events:all;}

.chat-status{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px 0;font-size:12px;color:rgba(255,255,255,0.6);font-weight:500;
  flex-shrink:0;
}

.chat-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 12px;
  border-bottom:0.5px solid #1e1e2e;flex-shrink:0;
}
.back-btn{
  color:#9b6dff;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:3px;padding:4px 0;
}
.chat-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#db2777);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.chat-name{font-size:15px;font-weight:600;color:#f0f0f5;}
.chat-sub{font-size:11px;color:#6b7280;margin-top:1px;}

.messages{
  flex:1;overflow-y:auto;
  padding:12px 12px 8px;
  display:flex;flex-direction:column;gap:3px;
}
.messages::-webkit-scrollbar{width:0;}

.date-divider{
  text-align:center;font-size:11px;color:#4b5563;
  margin:8px 0;letter-spacing:0.3px;
}

.bubble-row{display:flex;margin:1px 0;}
.bubble-row.me{justify-content:flex-end;}
.bubble-row.them{justify-content:flex-start;}

.bubble{
  max-width:72%;padding:9px 13px;
  border-radius:18px;font-size:14px;line-height:1.45;
  color:#f0f0f5;word-break:break-word;
  position:relative;
}
.bubble.me{
  background:#7c3aed;
  border-bottom-right-radius:4px;
}
.bubble.them{
  background:#1e1e2e;
  border:0.5px solid #2a2a3a;
  border-bottom-left-radius:4px;
}
.bubble.heart-final{
  background:linear-gradient(135deg,#7c3aed,#c026d3);
  font-size:15px;font-weight:500;
}
.bubble-ts{
  font-size:10px;color:#4b5563;
  margin:2px 4px 4px;
}
.me .bubble-ts{text-align:right;}

/* gerald typing in bubble */
.typing-bubble{
  background:#1e1e2e;
  border:0.5px solid #2a2a3a;
  border-radius:18px;border-bottom-left-radius:4px;
  padding:9px 13px;max-width:72%;min-width:40px;
  font-size:14px;line-height:1.45;color:#f0f0f5;
  word-break:break-word;
  font-family:'Inter',monospace;
}
.cursor{
  display:inline-block;width:2px;height:14px;
  background:#9b6dff;border-radius:1px;
  vertical-align:middle;margin-left:1px;
  animation:blink 0.7s infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* her typing area */
.choices-area{
  padding:10px 12px 14px;
  border-top:0.5px solid #1e1e2e;flex-shrink:0;
  background:#111118;
}
.choices-label{font-size:10px;color:#4b5563;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;padding:0 2px;}
.choice-btns{display:flex;flex-direction:column;gap:7px;}
.choice-btn{
  background:#1a1a28;
  border:0.5px solid #2d2d45;
  color:#c4b5fd;padding:10px 14px;
  border-radius:20px;font-size:13px;
  font-family:'Inter',sans-serif;cursor:pointer;
  text-align:left;transition:background 0.15s,border-color 0.15s;
  display:flex;align-items:center;gap:8px;
}
.choice-btn::before{content:'💬';font-size:12px;flex-shrink:0;}
.choice-btn:hover{background:#22223a;border-color:#7c3aed;}
.choice-btn:active{transform:scale(0.98);}
.choice-btn:disabled{opacity:0.4;cursor:default;transform:none;}

.fake-bar{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px 14px;
  border-top:0.5px solid #1e1e2e;flex-shrink:0;
  background:#111118;
}
.fake-input-wrap{
  flex:1;background:#1e1e2e;border:0.5px solid #2a2a3a;
  border-radius:20px;padding:8px 14px;
  font-size:13px;color:#f0f0f5;min-height:36px;
  display:flex;align-items:center;gap:2px;
  font-family:'Inter',sans-serif;
}
.fake-send{
  width:34px;height:34px;border-radius:50%;
  background:#7c3aed;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.fake-send svg{width:14px;height:14px;fill:#fff;}

.end-btn{
  display:block;margin:10px auto 0;
  background:transparent;border:0.5px solid #2d2d45;
  color:#7c3aed;padding:8px 20px;border-radius:20px;
  font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;
}
.end-btn:hover{background:#1a1a28;}

@keyframes popIn{from{opacity:0;transform:scale(0.9)translateY(4px);}to{opacity:1;transform:none;}}
.pop{animation:popIn 0.22s ease both;}

</style>
</head>
<body>

<div class="phone-shell">
  <div class="power-btn" id="powerBtn" title="Power"></div>
  <div class="vol-up"></div>
  <div class="vol-down"></div>
  <div class="notch"></div>

  <!-- LOCK SCREEN -->
  <div id="lockScreen">
    <div class="lock-time" id="lockTime">9:41</div>

      <div class="notif-header">

    <div class="app-grid">
      <div class="app-icon" onclick="openChat()">
        <div class="app-icon-img" style="background:linear-gradient(135deg,#34c759,#30b955);">

          <div class="app-badge">1</div>
        </div>
        <div class="app-icon-label">Messages</div>
      </div>
      <div class="app-icon" onclick="tapLocked()">
        <div class="app-icon-img" style="background:linear-gradient(135deg,#0a84ff,#0070e0);">📷</div>
        <div class="app-icon-label">Camera</div>
      </div>
      <div class="app-icon" onclick="tapLocked()">
        <div class="app-icon-img" style="background:linear-gradient(135deg,#ff9f0a,#e08000);">📸</div>
        <div class="app-icon-label">Photos</div>
      </div>
      <div class="app-icon" onclick="tapLocked()">
        <div class="app-icon-img" style="background:linear-gradient(135deg,#ff375f,#d42f55);">🎵</div>
        <div class="app-icon-label">Music</div>
      </div>
      <div class="app-icon" onclick="tapLocked()">
        <div class="app-icon-img" style="background:linear-gradient(135deg,#5e5ce6,#4a48c4);">📅</div>
        <div class="app-icon-label">Calendar</div>
      </div>
      <div class="app-icon" onclick="tapLocked()">
        <div class="app-icon-img" style="background:linear-gradient(135deg,#30d158,#25a244);">💰</div>

      </div>

  <!-- CHAT APP -->

<script>
// ---- CLOCK ----
function getTime(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function getDate(){const d=new Date();const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const months=['January','February','March','April','May','June','July','August','September','October','November','December'];return days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate();}
function updateClocks(){const t=getTime(),dt=getDate();document.getElementById('lockTime').textContent=t;document.getElementById('homeTime').textContent=t;document.getElementById('homeTimeBig').textContent=t;document.getElementById('chatTime').textContent=t;document.getElementById('homeDate').textContent=dt;document.getElementById('lockDate').textContent=dt;document.getElementById('notifTime').textContent='now';}
updateClocks();setInterval(updateClocks,30000);

// ---- SCREENS ----
const lockEl=document.getElementById('lockScreen');
const homeEl=document.getElementById('homeScreen');
const chatEl=document.getElementById('chatApp');
let currentScreen='lock';

function unlock(){
  lockEl.classList.add('unlock');
  setTimeout(()=>{lockEl.style.display='none';homeEl.classList.add('active');currentScreen='home';},500);
}
function goHome(){
  chatEl.classList.remove('active');
  homeEl.classList.add('active');
  currentScreen='home';
}
function openChat(){
  homeEl.classList.remove('active');
  chatEl.classList.add('active');
  currentScreen='chat';
  if(!chatStarted){chatStarted=true;setTimeout(startChat,400);}
}
function tapLocked(){
  const phone=document.querySelector('.phone-shell');
  phone.style.animation='shake 0.3s ease';
  setTimeout(()=>phone.style.animation='',300);
}

document.getElementById('powerBtn').onclick=()=>{
  if(currentScreen==='lock'){unlock();}
  else if(currentScreen==='home'){homeEl.classList.remove('active');lockEl.style.display='flex';lockEl.classList.remove('unlock');currentScreen='lock';}
  else if(currentScreen==='chat'){goHome();}
};

lockEl.addEventListener('click',unlock);
lockEl.addEventListener('touchstart',unlock);

const style=document.createElement('style');
style.textContent='@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
document.head.appendChild(style);

// ---- CHAT ENGINE ----
const msgsEl=document.getElementById('messages');
const choicesArea=document.getElementById('choicesArea');
const choiceABtn=document.getElementById('choiceA');
const choiceBBtn=document.getElementById('choiceB');
const fakeBar=document.getElementById('fakeBar');
const fakeInputText=document.getElementById('fakeInputText');
const chatSub=document.getElementById('chatSub');

let chatStarted=false;
let locked=false;
let branch=null;
let activeTypingEl=null;

function scrollBot(){setTimeout(()=>msgsEl.scrollTop=msgsEl.scrollHeight,60);}

function ts(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

function addBubble(text,side,cls=''){
  const row=document.createElement('div');
  row.className='bubble-row '+side+' pop';
  const bub=document.createElement('div');
  bub.className='bubble '+side+(cls?' '+cls:'');
  bub.innerHTML=text;
  row.appendChild(bub);
  if(side==='me'){const t=document.createElement('div');t.className='bubble-ts';t.textContent=ts();row.appendChild(t);}
  msgsEl.appendChild(row);
  scrollBot();
  return bub;
}

// Creates a live-typing bubble for Gerald, returns {el, setText, finish}
function createTypingBubble(){
  const row=document.createElement('div');
  row.className='bubble-row them pop';
  const bub=document.createElement('div');
  bub.className='typing-bubble';
  const textNode=document.createElement('span');
  const cursor=document.createElement('span');
  cursor.className='cursor';
  bub.appendChild(textNode);
  bub.appendChild(cursor);
  row.appendChild(bub);
  msgsEl.appendChild(row);
  activeTypingEl=row;
  scrollBot();
  return {
    setText:(t)=>{textNode.innerHTML=t;scrollBot();},
    finish:()=>{
      cursor.remove();
      bub.className='bubble them';
      row.className='bubble-row them pop';
      activeTypingEl=null;
    }
  };
}

// Simulate Gerald typing with occasional typos
async function geraldTypes(finalText){
  return new Promise(async resolve=>{
    chatSub.textContent='typing...';
    const tb=createTypingBubble();
    
    // Build a typo plan: randomly corrupt ~15% of chars
    let typed='';
    const chars=[...finalText];
    
    // insert random typo at a random position
    const typoAt=Math.random()<0.7?Math.floor(chars.length*0.35+Math.random()*chars.length*0.4):-1;
    const typoLen=Math.floor(Math.random()*3)+1;
    
    for(let i=0;i<chars.length;i++){
      // normal char delay
      const delay=30+Math.random()*50;
      await sleep(delay);
      
      if(i===typoAt){
        // type some wrong chars
        const wrongChars='qwertyuioasdfghjk'.split('');
        for(let t=0;t<typoLen;t++){
          typed+=wrongChars[Math.floor(Math.random()*wrongChars.length)];
          tb.setText(typed);
          await sleep(60+Math.random()*40);
        }
        // pause — "oh wait"
        await sleep(300+Math.random()*200);
        // backspace them all
        for(let t=0;t<typoLen;t++){
          typed=typed.slice(0,-1);
          tb.setText(typed);
          await sleep(60+Math.random()*30);
        }
        await sleep(100);
      }
      
      // type the correct char
      typed+=chars[i];
      tb.setText(typed);
    }
    
    await sleep(180);
    tb.finish();
    chatSub.textContent='Active now';
    resolve();
  });
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// Her typing in input bar then send
async function herTypes(text){
  fakeBar.style.display='flex';
  choicesArea.style.display='none';
  fakeInputText.textContent='';
  await sleep(300);
  for(const ch of [...text]){
    fakeInputText.textContent+=ch;
    await sleep(40+Math.random()*40);
  }
  await sleep(350);
  fakeBar.style.display='none';
  fakeInputText.textContent='';
}

function showChoices(a,b){
  choiceABtn.textContent=a;
  choiceBBtn.textContent=b;
  choiceABtn.disabled=false;

let currentNode=null;

async function runNode(id){
  locked=true;
  currentNode=id;
  const node=nodes[id];

  if(node.gerald){
    for(const msg of node.gerald){
      const delay=600+Math.random()*400;
      await sleep(delay);
      await geraldTypes(msg);
      await sleep(200);
    }
  }

  if(node.choices){
    showChoices(node.choices.A,node.choices.B);
    locked=false;
  } else if(node.after){
    await sleep(600);
    runNode(node.after);
  } else {
    // end
    await sleep(800);
    const btn=document.createElement('button');
    btn.className='end-btn pop';
    btn.textContent='🔄 Read again from the start';
    btn.onclick=restartChat;
    msgsEl.appendChild(btn);
    scrollBot();
    locked=false;
  }
}

async function pick(letter){
  if(locked||!currentNode)return;
  locked=true;
  const node=nodes[currentNode];
  if(!node.choices)return;
  const text=letter==='A'?node.choices.A:node.choices.B;
  const nextId=node.next[letter];
  choicesArea.style.display='none';
  await herTypes(text);
  addBubble(text,'me');
  await sleep(400);
  runNode(nextId);
}

window.pick=pick;

function startChat(){
  runNode('start');
}

function restartChat(){
  msgsEl.innerHTML='<div class="date-divider">Today</div>';
  locked=false;
  currentNode=null;
  branch=null;
  choicesArea.style.display='none';
  fakeBar.style.display='none';
  chatSub.textContent='Active now';
  startChat();
}
